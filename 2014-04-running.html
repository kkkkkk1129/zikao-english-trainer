<style>

.mtag.skill{background:#BEE3F8;color:#2B6CB0}.mtag.trap{background:#FED7D7;color:#9B2C2C}.mtag.method{background:#E9D8FD;color:#553C9A}
.answer-sec{padding:18px 20px;border-top:1px solid var(--border);display:none}
.answer-sec.show{display:block}

.abtn:disabled{cursor:default;opacity:.5}.abtn.correct:disabled,.abtn.wrong:disabled{opacity:1}
.ares{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;display:none;line-height:1.6}
.ares.show{display:block}
.ares.ok{background:var(--green-bg);border:1px solid var(--green-bd);color:var(--green)}
.ares.no{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red)}
.reveal-wrap{display:none}.reveal-wrap.show{display:block}
.next-sec{padding:18px 20px;text-align:center;display:none}.next-sec.show{display:block}
.next-btn{background:linear-gradient(135deg,#2B6CB0,#3182CE);color:#fff;border:none;padding:12px 40px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(43,108,176,.3);transition:.2s}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(43,108,176,.4)}
.score{background:var(--card);margin:12px;border-radius:var(--r);box-shadow:var(--shadow);padding:28px 20px;text-align:center;display:none}.score.show{display:block}
.score-emoji{font-size:44px;margin-bottom:12px}
.score-title{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;margin-bottom:6px}
.score-stats{display:flex;justify-content:center;gap:28px;margin:16px 0}
.stat-n{font-size:26px;font-weight:700}.stat-n.g{color:var(--green)}.stat-n.r{color:var(--red)}
.stat-l{font-size:11px;color:var(--text3);margin-top:2px}
.weak-box{background:var(--orange-bg);border:1px solid var(--orange-bd);border-radius:8px;padding:14px;text-align:left;margin-top:14px}
.weak-title{font-size:12px;font-weight:700;color:var(--orange);margin-bottom:4px}
.weak-text{font-size:12px;color:#744210;line-height:1.7}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn .4s ease forwards}

<script>
const EXAM={id:"2014-04",title:"2014年4月",subtitle:"Running: Sport or Way of Life?",
passage:`<p><span class="sent" id="s1">You go through the channels several times and find that once again there's nothing on TV that interests you.</span> <span class="sent" id="s2">Not a problem!</span> <span class="sent" id="s3">Just put on some running shoes and comfortable clothes and go for a run.</span></p>
<p><span class="sent" id="s4">One of the best things about the sport of running is that you don't need expensive equipment.</span> <span class="sent" id="s5">All you need is a good pair of running shoes and a safe environment.</span> <span class="sent" id="s6">But don't be fooled into thinking the sport of running is easy.</span> <span class="sent" id="s7">It requires discipline and concentration.</span></p>
<p><span class="sent" id="s8">Running is good for you both physically and mentally.</span> <span class="sent" id="s9">It strengthens your heart, lungs, and muscles.</span> <span class="sent" id="s10">It makes you more aware of your body.</span> <span class="sent" id="s11">Running also improves your body so that you don't get sick easily.</span> <span class="sent" id="s12">It can even help you to stay more focused in school because exercise helps you to think more clearly.</span></p>
<p><span class="sent" id="s13">How do you get engaged in the sport if you don't know much about it?</span> <span class="sent" id="s14">Most schools offer running programs.</span> <span class="sent" id="s15">A simple Internet search can help you find some in your area.</span> <span class="sent" id="s16">The programs show you how running can offer competition or just be for fun.</span> <span class="sent" id="s17">They also teach runners to set practical goals and take care of their bodies.</span></p>
<p><span class="sent" id="s18">Runners have great respect for each other because they know how difficult the sport can be.</span> <span class="sent" id="s19">If you go to a race, you'll see people cheering for all the runners.</span> <span class="sent" id="s20">Running isn't always about how fast you are running or how far you're going.</span> <span class="sent" id="s21">It's about getting out there and doing it.</span> <span class="sent" id="s22">Participation is more important than competition, and effort is recognized over talent.</span></p>
<p><span class="sent" id="s23">If you're looking for more than just a sport, running may be the perfect choice for you.</span></p>`,

questions:[
// ── Q1 TRUE ──
{num:1,text:"You may find it interesting to go for a run.",answer:"TRUE",hl:["s1","s3"],
step1:`题目中的关键信息：<br><br>
<div style="font-size:15px;line-height:1.9;color:var(--text)">You may find it <span class="hl-b">interesting</span> to <span class="hl-a">go for a run</span>.</div><br>
<strong>定位策略：用核心动词短语定位。</strong>搜索 <span class="hl-a">go for a run</span> 或 <span class="hl-b">interesting / interests</span>。`,
step2:`定位到第一段第1句和第3句：<br><br>
<div style="font-size:14px;line-height:1.9;color:var(--text)">"there's nothing on TV that <span class="hl-b">interests</span> you. Not a problem! Just put on some running shoes and comfortable clothes and <span class="hl-a">go for a run</span>."</div>
<div class="mlist">
<div class="mitem"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-b">interesting</span> <span class="mcn">（有趣的）</span></div><div class="msym-row approx">≈</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-b">interests you</span> <span class="mcn">（让你感兴趣，同根词转换）</span></div></div>
<div class="mitem"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-a">go for a run</span></div><div class="msym-row equal">=</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-a">go for a run</span> <span class="mcn">（完全一致）</span></div></div>
</div>
<span class="hl-b">黄色</span>同根词转换（interesting ≈ interests），<span class="hl-a">蓝色</span>完全一致。原文语境：电视没什么有趣的→没关系→去跑步吧！暗示跑步是有趣的替代活动。`,
step3:`<div class="cbox">
<div class="cbox-item cbox-q"><div class="cbox-label">题干含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px">You may find it <strong><span class="hl-b">interesting</span></strong> to <strong><span class="hl-a">go for a run</span></strong>.</div>你可能会觉得<span class="hl-a"><strong>去跑步</strong></span>是件<span class="hl-b"><strong>有趣的</strong></span>事。</div>
<div class="cbox-item cbox-p"><div class="cbox-label">原文含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px">Nothing on TV <strong><span class="hl-b">interests</span></strong> you... Just <strong><span class="hl-a">go for a run</span></strong>.</div>电视没什么能让你<span class="hl-b"><strong>感兴趣的</strong></span>→没关系→去<span class="hl-a"><strong>跑步</strong></span>吧！</div>
</div>
<div class="jbox true"><strong>关系判断：含义一致 ✅</strong><br><br>
<strong>interesting</strong> ≈ <strong>interests</strong>（同根词：形容词 ↔ 动词，都表示"有趣"）<br>
<strong>go for a run</strong> = <strong>go for a run</strong>（完全一致）<br><br>
原文用"电视没趣→去跑步"的逻辑暗示跑步是有趣的选择，题干说"你可能觉得跑步有趣"——含义一致。<br>
<span class="mtag method">核心方法：同根词转换识别（interesting ↔ interests）</span></div>`,
step4:`<div class="jbox true"><span class="jicon">✓</span><strong>答案：TRUE</strong><br><br>
interesting和interests是同根词转换（形容词↔动词）。原文暗示跑步是无聊电视的有趣替代，题干的"find it interesting"与此一致。<br>
<span class="mtag skill">同根词转换</span></div>`},

// ── Q2 FALSE ──
{num:2,text:"The sport of running is easy.",answer:"FALSE",hl:["s6","s7"],
step1:`题目中的关键信息：<br><br>
<div style="font-size:15px;line-height:1.9;color:var(--text)">The <span class="hl-a">sport of running</span> is <span class="hl-x">easy</span>.</div><br>
<strong>定位策略：用核心名词+形容词定位。</strong>搜索 <span class="hl-a">sport of running</span> + <span class="hl-x">easy</span> 或其反义词。`,
step2:`定位到第二段第3句：<br><br>
<div style="font-size:14px;line-height:1.9;color:var(--text)">"But <span class="hl-b">don't be fooled into thinking</span> the <span class="hl-a">sport of running</span> is <span class="hl-x">easy</span>. It <span class="hl-b">requires discipline and concentration</span>."</div>
<div class="mlist">
<div class="mitem"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-a">sport of running</span></div><div class="msym-row equal">=</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-a">sport of running</span> <span class="mcn">（完全一致）</span></div></div>
<div class="mitem conflict"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-x">is easy</span> <span class="mcn">（是容易的）</span></div><div class="msym-row conflict">✗</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-b">don't be fooled into thinking...is easy</span> <span class="mcn">（别以为容易——直接否定）</span></div></div>
</div>
<span class="hl-a">蓝色</span>完全一致，但<span class="hl-x">红色</span>被原文直接否定——"别以为容易"就是在说"不容易"。`,
step3:`<div class="cbox">
<div class="cbox-item cbox-q"><div class="cbox-label">题干含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px">The <strong><span class="hl-a">sport of running</span></strong> is <strong><span class="hl-x">easy</span></strong>.</div><span class="hl-a"><strong>跑步运动</strong></span><span class="hl-x"><strong>很容易</strong></span>。</div>
<div class="cbox-item cbox-p"><div class="cbox-label">原文含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px"><strong><span class="hl-b">Don't be fooled into thinking</span></strong> the <strong><span class="hl-a">sport of running</span></strong> is <strong><span class="hl-x">easy</span></strong>. It <strong><span class="hl-b">requires discipline and concentration</span></strong>.</div><span class="hl-b"><strong>别以为</strong></span><span class="hl-a"><strong>跑步运动</strong></span><span class="hl-x"><strong>容易</strong></span>，它<span class="hl-b"><strong>需要自律和专注</strong></span>。</div>
</div>
<div class="jbox false"><strong>关系判断：含义矛盾 ❌</strong><br><br>
<strong>sport of running</strong> = <strong>sport of running</strong>（对象一致 ✅）<br>
<strong><span class="hl-x">is easy</span></strong> ✗ <strong><span class="hl-b">don't be fooled into thinking...is easy</span></strong>（<strong>关键矛盾！</strong>"容易" vs "别以为容易"——原文直接否定了easy）<br><br>
原文还给出反面证据：requires discipline and concentration（需要自律和专注），进一步说明不容易。<br>
<span class="mtag trap">核心陷阱：直接否定（don't be fooled into thinking X = X is not true）</span></div>`,
step4:`<div class="jbox false"><span class="jicon">✗</span><strong>答案：FALSE</strong><br><br>
原文原话就是"别以为跑步容易"——don't be fooled into thinking...is easy，直接否定了题干的"is easy"。后面还补充"需要自律和专注"作为反面证据。<br>
<span class="mtag skill">否定句识别</span><span class="mtag trap">直接否定</span></div>`},

// ── Q3 NOT GIVEN ──
{num:3,text:"It is hard to find a safe environment for running.",answer:"NOT GIVEN",hl:["s5"],
step1:`题目中的关键信息：<br><br>
<div style="font-size:15px;line-height:1.9;color:var(--text)">It is <span class="hl-g">hard to find</span> a <span class="hl-a">safe environment</span> for running.</div><br>
<strong>定位策略：用核心名词定位。</strong>搜索 <span class="hl-a">safe environment</span>。<span class="hl-g">hard to find</span> 标灰色——需要验证原文是否评价了"难不难找"。`,
step2:`定位到第二段第2句：<br><br>
<div style="font-size:14px;line-height:1.9;color:var(--text)">"All you need is a good pair of running shoes and a <span class="hl-a">safe environment</span>."</div>
<div class="mlist">
<div class="mitem"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-a">safe environment</span> <span class="mcn">（安全的环境）</span></div><div class="msym-row equal">=</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-a">safe environment</span> <span class="mcn">（完全一致）</span></div></div>

<div class="cbox-item cbox-q"><div class="cbox-label">题干含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px"><strong><span class="hl-a">Runners</span></strong> <strong><span class="hl-b">respect one another</span></strong> <strong><span class="hl-x">as they love the sport</span></strong>.</div><span class="hl-a"><strong>跑步者</strong></span>互相<span class="hl-b"><strong>尊重</strong></span>，<span class="hl-x"><strong>因为他们热爱这项运动</strong></span>。</div>

</div>
<div class="jbox false"><strong>关系判断：含义矛盾 ❌</strong><br><br>
<strong>Runners</strong> = <strong>Runners</strong>（主语一致 ✅）<br>
<strong>respect one another</strong> ≈ <strong>have great respect for each other</strong>（互相尊重 ✅）<br>
<strong><span class="hl-x">as they love the sport</span></strong>（因为热爱运动）✗ <strong><span class="hl-c">because they know how difficult the sport can be</span></strong>（因为了解运动的艰难）— <strong>关键矛盾！原因被偷换</strong><br><br>

"互相尊重"是对的，但原因不对。原文说因为"知道这项运动有多难"，题干换成了"热爱运动"。做阅读判断要看完整句子，包括原因状语——事实对了但原因错了，整句仍然是FALSE。<br>

// ═══════ RENDERING ENGINE (same as template) ═══════
const S={cur:0,answers:{},steps:{},total:EXAM.questions.length};
EXAM.questions.forEach((_,i)=>S.steps[i]=0);
function init(){const prog=document.getElementById('prog');for(let i=0;i<S.total;i++){const d=document.createElement('div');d.className='dot'+(i===0?' active':'');d.id='dot'+i;d.textContent=i+1;d.onclick=()=>jumpTo(i);prog.appendChild(d)}const app=document.getElementById('app');EXAM.questions.forEach((q,i)=>{const card=document.createElement('div');card.className='qcard'+(i===0?' active fade-in':'');card.id='qcard'+i;card.innerHTML=buildCard(q,i);app.appendChild(card)});app.innerHTML+=`<div class="score" id="scoreCard"><div class="score-emoji" id="scoreEmoji">🎯</div><div class="score-title" id="scoreTitle">训练完成！</div><div class="score-stats"><div><div class="stat-n g" id="sc-right">0</div><div class="stat-l">正确</div></div><div><div class="stat-n r" id="sc-wrong">0</div><div class="stat-l">错误</div></div><div><div class="stat-n" style="color:var(--accent)" id="sc-total">${S.total}</div><div class="stat-l">共计</div></div></div><div id="sc-detail" style="font-size:13px;color:var(--text2);line-height:1.8;margin:10px 0"></div><div class="weak-box" id="weakBox" style="display:none"><div class="weak-title">📌 需要重点加强</div><div class="weak-text" id="weakText"></div></div></div>`}
function buildCard(q,i){const isLast=i===S.total-1;return`<div class="qtop"><div class="qlabel">📝 第 ${q.num} 题</div><div class="qtext">${q.text}</div></div><div class="passage" id="psg${i}"><div class="passage-head" onclick="togglePsg(${i})">📄 阅读原文 <span id="psg-tog${i}">收起 ▾</span></div><div class="passage-body" id="psg-body${i}">${EXAM.passage}</div></div><div><div class="steps-hd">🔍 解题思路拆解</div>${buildStep(i,0,'找出题目关键词',q.step1)}${buildStep(i,1,'在原文中定位',q.step2)}${buildStep(i,2,'含义判断',q.step3)}</div><div class="answer-sec" id="ans${i}"><div class="answer-prompt">根据以上分析，你的判断是：</div><div class="answer-opts"><button class="abtn" onclick="answer(${i},'TRUE')">TRUE</button><button class="abtn" onclick="answer(${i},'FALSE')">FALSE</button><button class="abtn" onclick="answer(${i},'NOT GIVEN')">NOT GIVEN</button></div><div class="ares" id="ares${i}"></div></div><div class="reveal-wrap" id="rev${i}"><div><div class="steps-hd">💡 答案揭晓</div><div style="padding:16px 20px"><div class="sinner">${q.step4}</div></div></div></div><div class="next-sec" id="nxt${i}"><button class="next-btn" onclick="${isLast?'showScore()':'go('+(i+1)+')'}">${isLast?'查看训练报告 →':'下一题 →'}</button></div>`}
function buildStep(qi,si,title,content){const cls=si===0?'step unlocked':'step';const lock=si===0?'':'locked';return`<div class="${cls}" id="st${qi}-${si}" onclick="reveal(${qi},${si})"><div class="step-hd ${lock}"><div class="snum">${si+1}</div><div class="stitle">${title}</div><div class="sarrow">▸</div></div><div class="scontent"><div class="sinner">${content}</div></div></div>`}
function togglePsg(i){const body=document.getElementById('psg-body'+i);const tog=document.getElementById('psg-tog'+i);body.classList.toggle('collapsed');tog.textContent=body.classList.contains('collapsed')?'展开 ▸':'收起 ▾'}
function reveal(qi,si){if(S.steps[qi]<si)return;const el=document.getElementById('st'+qi+'-'+si);if(el.classList.contains('revealed'))return;el.classList.add('revealed','unlocked');el.querySelector('.step-hd').classList.remove('locked');S.steps[qi]=si+1;if(si<2){const nxt=document.getElementById('st'+qi+'-'+(si+1));if(nxt){nxt.classList.add('unlocked');nxt.querySelector('.step-hd').classList.remove('locked')}}if(si===1){const q=EXAM.questions[qi];document.querySelectorAll('#qcard'+qi+' .sent').forEach(s=>{if(q.hl.includes(s.id))s.classList.add('hl');else if(q.hl.length>0)s.classList.add('dim')})}if(si===2){const ans=document.getElementById('ans'+qi);ans.classList.add('show','fade-in');setTimeout(()=>ans.scrollIntoView({behavior:'smooth',block:'center'}),200)}}
function answer(qi,val){if(S.answers[qi])return;S.answers[qi]=val;const q=EXAM.questions[qi];const ok=val===q.answer;document.querySelectorAll('#ans'+qi+' .abtn').forEach(b=>{b.disabled=true;if(b.textContent===val)b.classList.add(ok?'correct':'wrong');if(!ok&&b.textContent===q.answer)b.classList.add('correct')});const res=document.getElementById('ares'+qi);res.classList.add('show',ok?'ok':'no');res.textContent=ok?'✅ 正确！看看完整解析：':'❌ 你选了 '+val+'，正确答案是 '+q.answer+'。看看为什么：';setTimeout(()=>{const rev=document.getElementById('rev'+qi);rev.classList.add('show','fade-in');document.getElementById('nxt'+qi).classList.add('show');rev.scrollIntoView({behavior:'smooth',block:'center'})},400)}
function jumpTo(qi){if(qi===S.cur&&!document.getElementById('scoreCard').classList.contains('show'))return;document.getElementById('scoreCard').classList.remove('show');const curCard=document.getElementById('qcard'+S.cur);if(curCard){curCard.querySelectorAll('.sent').forEach(s=>s.className='sent');curCard.classList.remove('active')}const pd=document.getElementById('dot'+S.cur);pd.classList.remove('active');if(S.answers[S.cur]!==undefined)pd.classList.add(S.answers[S.cur]===EXAM.questions[S.cur].answer?'done-right':'done-wrong');const card=document.getElementById('qcard'+qi);card.classList.add('active','fade-in');const nd=document.getElementById('dot'+qi);nd.classList.remove('done-right','done-wrong');nd.classList.add('active');S.cur=qi;window.scrollTo({top:0,behavior:'smooth'})}
function go(qi){jumpTo(qi)}
function showScore(){document.getElementById('qcard'+S.cur).classList.remove('active');const pd=document.getElementById('dot'+S.cur);pd.classList.remove('active');if(S.answers[S.cur]!==undefined)pd.classList.add(S.answers[S.cur]===EXAM.questions[S.cur].answer?'done-right':'done-wrong');let right=0,wrong=0,wrongs=[];EXAM.questions.forEach((q,i)=>{if(S.answers[i]===q.answer)right++;else{wrong++;wrongs.push(q)}});document.getElementById('sc-right').textContent=right;document.getElementById('sc-wrong').textContent=wrong;const emoji=document.getElementById('scoreEmoji');const title=document.getElementById('scoreTitle');if(right>=9){emoji.textContent='🎉';title.textContent='太棒了！'}else if(right>=7){emoji.textContent='💪';title.textContent='表现不错！'}else if(right>=5){emoji.textContent='📖';title.textContent='继续加油！'}else{emoji.textContent='🔄';title.textContent='需要多练习'}document.getElementById('sc-detail').textContent=`${S.total}题中答对${right}题。`;if(wrongs.length>0){document.getElementById('weakBox').style.display='block';document.getElementById('weakText').textContent='错题：'+wrongs.map(q=>'第'+q.num+'题('+q.answer+')').join('、')+'。建议回顾这些题的解题思路，重点关注步骤3的含义判断。'}document.getElementById('scoreCard').classList.add('show','fade-in');window.scrollTo({top:0,behavior:'smooth'})}
init();
</script>
</body>
</html>
