<script>
// ═══════════════════════════════════════
//  EXAM DATA — 2013年10月
// ═══════════════════════════════════════
const EXAM = {
id:"2013-10",
title:"2013年10月",
subtitle:"Farms Appear in Cities",
passage:`<p><span class="sent" id="s1">When you hear the word "farm", you may imagine the countryside with cows and crops.</span> <span class="sent" id="s2">But scientists say the farms of the future could be built in tall buildings in some large cities.</span></p>
<p><span class="sent" id="s3">It may be difficult to believe, but in fact, the technology for growing crops indoors already exists.</span> <span class="sent" id="s4">Farming in the city is already happening.</span> <span class="sent" id="s5">Some vegetables are already grown in green houses.</span> <span class="sent" id="s6">Even the scientists at the South Pole research station can enjoy fresh vegetables they grow in their own greenhouse.</span></p>
<p><span class="sent" id="s7">Experts say indoor farming solves many problems.</span> <span class="sent" id="s8">First, traditional farming takes up a lot of land.</span> <span class="sent" id="s9">Growing crops in tall buildings--called vertical farming--can solve the problem.</span> <span class="sent" id="s10">Also, fruits and vegetables grown indoors would not face serious threats from insects and bad weather.</span></p>
<p><span class="sent" id="s11">Though vertical farms don't exist yet, experts have created a plan for recycling in such farms.</span> <span class="sent" id="s12">The water from indoor fish ponds would be used to water crops.</span> <span class="sent" id="s13">Gases from crop waste would be used to heat the building.</span> <span class="sent" id="s14">Waste from chicken or pigs would be reused as a source of energy.</span></p>
<p><span class="sent" id="s15">But experts believe vertical farming is not going to be easy.</span> <span class="sent" id="s16">They say it can be difficult to control climate conditions indoors.</span> <span class="sent" id="s17">Besides, plants differ in their weather and lighting needs.</span> <span class="sent" id="s18">For example, some plants like warm, sunny weather, but other plants prefer cooler temperatures.</span></p>
<p><span class="sent" id="s19">That's not to say these difficulties won't be overcome--but it will take time.</span> <span class="sent" id="s20">Most experts suggest it may take almost 5 to 15 years before the first vertical farms could be created.</span></p>`,

questions:[
// ────── Q1 TRUE ──────
{num:1, text:`The word "farm" may make you think of the countryside.`, answer:"TRUE", hl:["s1"],
step1:`题目中的关键信息：<br><br>
<div style="font-size:15px;line-height:1.9;color:var(--text)">The word "<span class="hl-a">farm</span>" may make you <span class="hl-b">think of</span> the <span class="hl-c">countryside</span>.</div><br>
<strong>定位策略：用核心名词定位。</strong>题干中 <span class="hl-a">farm</span> 和 <span class="hl-c">countryside</span> 都是具体名词，直接在原文首段扫读。`,

step2:`定位到第一段第1句：<br><br>
<div style="font-size:14px;line-height:1.9;color:var(--text)">"When you hear the word '<span class="hl-a">farm</span>', you may <span class="hl-b">imagine</span> the <span class="hl-c">countryside</span> with cows and crops."</div>
<div class="mlist">
<div class="mitem"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-b">think of</span> <span class="mcn">（想到）</span></div><div class="msym-row approx">≈</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-b">imagine</span> <span class="mcn">（想象，同义动词）</span></div></div>
<div class="mitem"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-a">farm</span></div><div class="msym-row equal">=</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-a">farm</span> <span class="mcn">（完全一致）</span></div></div>
<div class="mitem"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-c">countryside</span></div><div class="msym-row equal">=</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-c">countryside</span> <span class="mcn">（完全一致）</span></div></div>
</div>
<span class="hl-b">黄色</span>同义，<span class="hl-a">蓝色</span><span class="hl-c">绿色</span>完全一致，高度对应，定位成功。`,

step3:`<div class="cbox">
<div class="cbox-item cbox-q"><div class="cbox-label">题干含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px">The word "<strong><span class="hl-a">farm</span></strong>" may make you <strong><span class="hl-b">think of</span></strong> the <strong><span class="hl-c">countryside</span></strong>.</div><span class="hl-a"><strong>farm</strong></span>这个词可能让你<span class="hl-b"><strong>想到</strong></span><span class="hl-c"><strong>乡村</strong></span>。</div>
<div class="cbox-item cbox-p"><div class="cbox-label">原文含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px">When you hear the word "<strong><span class="hl-a">farm</span></strong>", you may <strong><span class="hl-b">imagine</span></strong> the <strong><span class="hl-c">countryside</span></strong>.</div>当你听到<span class="hl-a"><strong>farm</strong></span>这个词时，你可能会<span class="hl-b"><strong>联想到</strong></span><span class="hl-c"><strong>乡村</strong></span>。</div>
</div>
<div class="jbox true"><strong>关系判断：含义一致 ✅</strong><br><br>
<strong>think of</strong> ≈ <strong>imagine</strong>（同义动词，都表示"联想到"）<br>
<strong>farm</strong> = <strong>farm</strong>（完全一致）<br>
<strong>countryside</strong> = <strong>countryside</strong>（完全一致）<br><br>
对象、动作、地点全部对应——含义完全一致。<br>
<span class="mtag method">核心方法：同义改写识别 → 同义定位 → 同义解题</span></div>`,

step4:`<div class="jbox true"><span class="jicon">✓</span><strong>答案：TRUE</strong><br><br>
题干说"farm让你想到countryside"，原文说"听到farm你可能会联想到countryside"。think of ≈ imagine，其余完全一致。<br>
<span class="mtag skill">同义改写识别</span></div>`},

// ────── Q2 FALSE ──────
{num:2, text:"It is still a dream for people to grow crops indoors.", answer:"FALSE", hl:["s3","s4"],
step1:`题目中的关键信息：<br><br>
<div style="font-size:15px;line-height:1.9;color:var(--text)">It is <span class="hl-x">still a dream</span> for people to <span class="hl-a">grow crops indoors</span>.</div><br>
<strong>定位策略：用核心概念词定位。</strong>搜索 <span class="hl-a">grow crops indoors</span> 或其近义表达。<br><br>
⚠️ 注意 <span class="hl-x">still a dream</span>（仍是梦想）——暗示"尚未实现"，需要在原文验证是否属实。`,

step2:`定位到第二段第1-2句：<br><br>
<div style="font-size:14px;line-height:1.9;color:var(--text)">"in fact, the technology for <span class="hl-a">growing crops indoors</span> <span class="hl-b">already exists</span>. Farming in the city is <span class="hl-b">already happening</span>."</div>
<div class="mlist">
<div class="mitem"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-a">grow crops indoors</span> <span class="mcn">（在室内种庄稼）</span></div><div class="msym-row equal">=</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-a">growing crops indoors</span> <span class="mcn">（完全一致）</span></div></div>
<div class="mitem conflict"><div class="mrow"><span class="mlabel">题干</span> <span class="hl-x">still a dream</span> <span class="mcn">（仍是梦想，尚未实现）</span></div><div class="msym-row conflict">✗</div><div class="mrow"><span class="mlabel">原文</span> <span class="hl-b">already exists / already happening</span> <span class="mcn">（已经存在，已经在发生）</span></div></div>
</div>
<span class="hl-a">蓝色</span>对象一致，但<span class="hl-x">红色</span>出现关键矛盾——题干说"仍是梦想"，原文说"已经实现"。`,

step3:`<div class="cbox">
<div class="cbox-item cbox-q"><div class="cbox-label">题干含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px">It is <strong><span class="hl-x">still a dream</span></strong> for people to <strong><span class="hl-a">grow crops indoors</span></strong>.</div>对人们来说，<span class="hl-a"><strong>在室内种庄稼</strong></span><span class="hl-x"><strong>仍然是一个梦想</strong></span>。</div>
<div class="cbox-item cbox-p"><div class="cbox-label">原文含义</div><div style="font-size:12px;color:var(--accent);margin-bottom:3px">The technology for <strong><span class="hl-a">growing crops indoors</span></strong> <strong><span class="hl-b">already exists</span></strong>.</div><span class="hl-a"><strong>室内种植</strong></span>的技术<span class="hl-b"><strong>已经存在</strong></span>，城市农业已经在发生。</div>
</div>
<div class="jbox false"><strong>关系判断：含义矛盾 ❌</strong><br><br>
<strong>grow crops indoors</strong> = <strong>growing crops indoors</strong>（对象一致 ✅）<br>
<strong><span class="hl-x">still a dream</span></strong> ✗ <strong><span class="hl-b">already exists</span></strong>（<strong>关键矛盾！</strong>"梦想"意味着未实现，"已经存在"意味着已实现）<br><br>
原文用了两个 <strong>already</strong>（already exists + already happening）作为反面证据，直接否定了"仍是梦想"。<br>
<span class="mtag trap">核心陷阱：时态/状态偷换（未实现→已实现）</span></div>`,

step4:`<div class="jbox false"><span class="jicon">✗</span><strong>答案：FALSE</strong><br><br>
题干说室内种植"仍是梦想"，原文连用两个already强调"已经存在""已经在发生"。梦想 vs 现实——直接矛盾。<br>
<span class="mtag skill">反面证据识别</span><span class="mtag trap">状态偷换</span></div>`},

// ────── Q3 NOT GIVEN ──────
{num:3, text:"Scientists at the South Pole research station live a hard life.", answer:"NOT GIVEN", hl:["s6"],
step1:`题目中的关键信息：<br><br>
<div style="font-size:15px;line-height:1.9;color:var(--text)"><span class="hl-a">Scientists at the South Pole research station</span> <span class="hl-g">live a hard life</span>.</div><br>
<strong>定位策略：用专有名词定位。</strong><span class="hl-a">South Pole</span> 是专有名词，首字母大写，在原文中一眼就能找到。<br><br>
⚠️ 注意 <span class="hl-g">live a hard life</span> 用灰色标注——需要验证原文是否讨论了他们的生活状况。`,

step2:`搜索"South Pole"，定位到第二段第4句：<br><br>

// ═══════════════════════════════════════
//  RENDERING ENGINE
// ═══════════════════════════════════════
const S = {cur:0, answers:{}, steps:{}, total:EXAM.questions.length};
EXAM.questions.forEach((_,i)=>S.steps[i]=0);

function init(){
  // Progress dots
  const prog=document.getElementById('prog');
  for(let i=0;i<S.total;i++){
    const d=document.createElement('div');
    d.className='dot'+(i===0?' active':'');
    d.id='dot'+i;
    d.textContent=i+1;
    d.onclick=()=>jumpTo(i);
    prog.appendChild(d);
  }
  // Render all question cards
  const app=document.getElementById('app');
  EXAM.questions.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='qcard'+(i===0?' active fade-in':'');
    card.id='qcard'+i;
    card.innerHTML=buildCard(q,i);
    app.appendChild(card);
  });
  // Score card
  app.innerHTML+=`<div class="score" id="scoreCard">
    <div class="score-emoji" id="scoreEmoji">🎯</div>
    <div class="score-title" id="scoreTitle">训练完成！</div>
    <div class="score-stats"><div><div class="stat-n g" id="sc-right">0</div><div class="stat-l">正确</div></div><div><div class="stat-n r" id="sc-wrong">0</div><div class="stat-l">错误</div></div><div><div class="stat-n" style="color:var(--accent)" id="sc-total">${S.total}</div><div class="stat-l">共计</div></div></div>
    <div id="sc-detail" style="font-size:13px;color:var(--text2);line-height:1.8;margin:10px 0"></div>
    <div class="weak-box" id="weakBox" style="display:none"><div class="weak-title">📌 需要重点加强</div><div class="weak-text" id="weakText"></div></div>
  </div>`;
}

function buildCard(q,i){
  const isLast=i===S.total-1;
  return `
  <div class="qtop"><div class="qlabel">📝 第 ${q.num} 题</div><div class="qtext">${q.text}</div></div>
  <div class="passage" id="psg${i}">
    <div class="passage-head" onclick="togglePsg(${i})">📄 阅读原文 <span id="psg-tog${i}">收起 ▾</span></div>
    <div class="passage-body" id="psg-body${i}">${EXAM.passage}</div>
  </div>
  <div><div class="steps-hd">🔍 解题思路拆解</div>
  ${buildStep(i,0,'找出题目关键词',q.step1)}
  ${buildStep(i,1,'在原文中定位',q.step2)}
  ${buildStep(i,2,'含义判断',q.step3)}
  </div>
  <div class="answer-sec" id="ans${i}">
    <div class="answer-prompt">根据以上分析，你的判断是：</div>
    <div class="answer-opts">
      <button class="abtn" onclick="answer(${i},'TRUE')">TRUE</button>
      <button class="abtn" onclick="answer(${i},'FALSE')">FALSE</button>
      <button class="abtn" onclick="answer(${i},'NOT GIVEN')">NOT GIVEN</button>
    </div>
    <div class="ares" id="ares${i}"></div>
  </div>
  <div class="reveal-wrap" id="rev${i}">
    <div><div class="steps-hd">💡 答案揭晓</div>
    <div style="padding:16px 20px"><div class="sinner">${q.step4}</div></div></div>
  </div>
  <div class="next-sec" id="nxt${i}">
    <button class="next-btn" onclick="${isLast?'showScore()':'go('+(i+1)+')'}">${isLast?'查看训练报告 →':'下一题 →'}</button>
  </div>`;
}

function buildStep(qi,si,title,content){
  const cls=si===0?'step unlocked':'step';
  const lock=si===0?'':'locked';
  return `<div class="${cls}" id="st${qi}-${si}" onclick="reveal(${qi},${si})">
    <div class="step-hd ${lock}"><div class="snum">${si+1}</div><div class="stitle">${title}</div><div class="sarrow">▸</div></div>
    <div class="scontent"><div class="sinner">${content}</div></div>
  </div>`;
}

function togglePsg(i){
  const body=document.getElementById('psg-body'+i);
  const tog=document.getElementById('psg-tog'+i);
  body.classList.toggle('collapsed');
  tog.textContent=body.classList.contains('collapsed')?'展开 ▸':'收起 ▾';
}

function reveal(qi,si){
  if(S.steps[qi]<si)return;
  const el=document.getElementById('st'+qi+'-'+si);
  if(el.classList.contains('revealed'))return;
  el.classList.add('revealed','unlocked');
  el.querySelector('.step-hd').classList.remove('locked');
  S.steps[qi]=si+1;
  // unlock next
  if(si<2){
    const nxt=document.getElementById('st'+qi+'-'+(si+1));
    if(nxt){nxt.classList.add('unlocked');nxt.querySelector('.step-hd').classList.remove('locked');}
  }
  // highlight passage on step 2
  if(si===1){
    const q=EXAM.questions[qi];
    document.querySelectorAll('#qcard'+qi+' .sent').forEach(s=>{
      if(q.hl.includes(s.id))s.classList.add('hl');
      else if(q.hl.length>0)s.classList.add('dim');
    });
  }
  // show answer section after step 3
  if(si===2){
    const ans=document.getElementById('ans'+qi);
    ans.classList.add('show');
    ans.classList.add('fade-in');
    setTimeout(()=>ans.scrollIntoView({behavior:'smooth',block:'center'}),200);
  }
}

function answer(qi,val){
  if(S.answers[qi])return;
  S.answers[qi]=val;
  const q=EXAM.questions[qi];
  const ok=val===q.answer;
  // style buttons
  document.querySelectorAll('#ans'+qi+' .abtn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===val)b.classList.add(ok?'correct':'wrong');
    if(!ok&&b.textContent===q.answer)b.classList.add('correct');
  });
  // result text
  const res=document.getElementById('ares'+qi);
  res.classList.add('show',ok?'ok':'no');
  res.textContent=ok?'✅ 正确！看看完整解析：':'❌ 你选了 '+val+'，正确答案是 '+q.answer+'。看看为什么：';
  // show step 4 + next
  setTimeout(()=>{
    const rev=document.getElementById('rev'+qi);
    rev.classList.add('show','fade-in');
    document.getElementById('nxt'+qi).classList.add('show');
    rev.scrollIntoView({behavior:'smooth',block:'center'});
  },400);
}

function jumpTo(qi){
  if(qi===S.cur && !document.getElementById('scoreCard').classList.contains('show'))return;
  // hide score card if showing
  document.getElementById('scoreCard').classList.remove('show');
  // clear highlights on current card
  const curCard=document.getElementById('qcard'+S.cur);
  if(curCard)curCard.querySelectorAll('.sent').forEach(s=>s.className='sent');
  // hide current card
  if(curCard)curCard.classList.remove('active');
  // update previous dot
  const pd=document.getElementById('dot'+S.cur);
  pd.classList.remove('active');
  if(S.answers[S.cur]!==undefined){
    pd.classList.add(S.answers[S.cur]===EXAM.questions[S.cur].answer?'done-right':'done-wrong');
  }
  // show target card
  const card=document.getElementById('qcard'+qi);
  card.classList.add('active','fade-in');
  // update target dot
  const nd=document.getElementById('dot'+qi);
  nd.classList.remove('done-right','done-wrong');
  nd.classList.add('active');
  S.cur=qi;
  window.scrollTo({top:0,behavior:'smooth'});
}

function go(qi){
  jumpTo(qi);
}

function showScore(){
  document.getElementById('qcard'+S.cur).classList.remove('active');
  const pd=document.getElementById('dot'+S.cur);
  pd.classList.remove('active');
  pd.classList.add(S.answers[S.cur]===EXAM.questions[S.cur].answer?'done-right':'done-wrong');

  let right=0,wrong=0,wrongs=[];
  EXAM.questions.forEach((q,i)=>{
    if(S.answers[i]===q.answer)right++;
    else{wrong++;wrongs.push(q);}
  });
  document.getElementById('sc-right').textContent=right;
  document.getElementById('sc-wrong').textContent=wrong;
  const sc=document.getElementById('scoreCard');
  const emoji=document.getElementById('scoreEmoji');
  const title=document.getElementById('scoreTitle');
  const detail=document.getElementById('sc-detail');
  if(right>=9){emoji.textContent='🎉';title.textContent='太棒了！';}
  else if(right>=7){emoji.textContent='💪';title.textContent='表现不错！';}
  else if(right>=5){emoji.textContent='📖';title.textContent='继续加油！';}
  else{emoji.textContent='🔄';title.textContent='需要多练习';}
  detail.textContent=`${S.total}题中答对${right}题。`;
  if(wrongs.length>0){
    document.getElementById('weakBox').style.display='block';
    document.getElementById('weakText').textContent='错题：'+wrongs.map(q=>'第'+q.num+'题('+q.answer+')').join('、')+'。建议回顾这些题的解题思路，重点关注步骤3的含义判断。';
  }
  sc.classList.add('show','fade-in');
  window.scrollTo({top:0,behavior:'smooth'});
}

init();
</script>
</body>
</html>
